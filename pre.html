<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CIRP Pre Assessment | Rumination Life Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap">
<style>
  :root {
    --bg: #F3F5F8; --surface: #FFFFFF; --sunk: #EEF2F6; --ink: #13233A; --muted: #5A6878; --line: #DCE2E9;
    --brand: #1E3A6D; --pre: #2D6CB3; --post: #5A9E37; --down: #B23A30;
    --accent: var(--pre); --accent-soft: rgba(45,108,179,.12);
    --f-ui: "Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
    --f-title: "Source Serif 4", Georgia, "Times New Roman", serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 16px; line-height: 1.5; }
  .wrap { max-width: 680px; margin: 0 auto; padding: 0 max(16px, env(safe-area-inset-right, 0px)) 72px max(16px, env(safe-area-inset-left, 0px)); }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  /* Header */
  .mast { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 16px 0 14px; border-bottom: 1px solid var(--line); }
  .logo { background: #FFFFFF; border-radius: 8px; padding: 6px 10px; display: flex; align-items: center; }
  .logo img { height: 46px; width: auto; display: block; }
  .prog { text-align: center; min-width: 0; }
  .prog .pn { font-family: var(--f-title); font-weight: 700; font-size: clamp(17px, 2.6vw, 22px); line-height: 1.2; color: var(--brand); text-wrap: balance; }
  .prog .ps { font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; color: var(--muted); margin-top: 4px; }
  @media (max-width: 640px) {
    .mast { grid-template-columns: 1fr 1fr; }
    .prog { grid-column: 1 / -1; grid-row: 2; }
    .mast .logo:last-child { justify-self: end; }
    .logo img { height: 36px; }
  }

  /* Title */
  .titleblock { padding: 22px 0 6px; }
  .eyebrow { font-size: 12.5px; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; color: var(--accent); }
  h1 { font-family: var(--f-title); font-size: clamp(26px, 5vw, 32px); line-height: 1.2; margin: 4px 0 6px; }
  .sub { color: var(--muted); font-size: 15px; }

  /* Cards */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; margin-top: 18px; }
  .card h2 { font-size: 18px; margin-bottom: 14px; }
  .field { margin-bottom: 16px; }
  .field:last-child { margin-bottom: 0; }
  .field label { display: block; font-size: 14px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
  .field label .req { color: var(--down); }
  .field input, .field select { width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: #FFFFFF; font-size: 16px; }
  .field select { appearance: none; background-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%235A6878' d='M7 10l5 5 5-5z'/%3E%3C/svg%3E"); background-repeat: no-repeat; background-position: right 12px center; background-size: 20px; padding-right: 40px; }
  .field input:focus, .field select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .field.bad input, .field.bad select { border-color: var(--down); }
  .ferr { color: var(--down); font-size: 13px; margin-top: 5px; display: none; }
  .field.bad .ferr { display: block; }

  .howto { background: var(--accent-soft); border-left: 4px solid var(--accent); border-radius: 12px; padding: 16px 18px; margin-top: 18px; font-size: 15px; }
  .howto b { display: block; margin-bottom: 4px; }

  /* Progress */
  .progress { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding: 12px 0 10px; margin-top: 18px; }
  .ptext { display: flex; justify-content: space-between; font-size: 13.5px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
  .pbar { height: 6px; background: var(--line); border-radius: 6px; overflow: hidden; }
  .pfill { height: 100%; width: 0; background: var(--accent); border-radius: 6px; transition: width .25s ease; }

  /* Parts */
  .part { margin-top: 26px; }
  .part h2 { font-family: var(--f-title); font-size: 22px; line-height: 1.25; padding-bottom: 6px; border-bottom: 2px solid var(--accent); }
  .part .intro { color: var(--muted); font-size: 15px; margin: 8px 0 14px; font-style: italic; }
  .story { background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--brand); border-radius: 12px; padding: 18px 20px; margin-bottom: 14px; }
  .story h3 { font-family: var(--f-title); font-size: 19px; margin-bottom: 8px; color: var(--brand); }
  .story p { font-size: 15.5px; margin-bottom: 8px; }
  .story p:last-child { margin-bottom: 0; }

  .q { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 14px; }
  .q.missing { border-color: var(--down); }
  .qn { font-size: 13px; font-weight: 700; color: var(--accent); margin-bottom: 4px; }
  .qt { font-size: 16.5px; font-weight: 600; margin-bottom: 12px; }
  .opts { display: grid; gap: 8px; }
  .opt { display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: start; text-align: left; width: 100%; min-height: 48px; padding: 11px 14px; border: 1px solid var(--line); border-radius: 10px; background: #FFFFFF; cursor: pointer; font-size: 15.5px; line-height: 1.4; transition: background .12s, border-color .12s; }
  .opt .k { font-weight: 700; color: var(--muted); }
  .opt:hover { border-color: var(--accent); }
  .opt[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #FFFFFF; }
  .opt[aria-pressed="true"] .k { color: #FFFFFF; }
  .scale { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
  .sbtn { min-height: 64px; padding: 8px 1px; min-width: 0; border: 1px solid var(--line); border-radius: 10px; background: #FFFFFF; cursor: pointer; text-align: center; }
  .sbtn .n { display: block; font-size: 19px; font-weight: 700; }
  .sbtn .l { display: block; font-size: 10.5px; color: var(--muted); line-height: 1.15; margin-top: 2px; overflow-wrap: anywhere; }
  @media (max-width: 400px) { .sbtn .l { font-size: 9.5px; } .scale { gap: 4px; } }
  .sbtn:hover { border-color: var(--accent); }
  .sbtn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #FFFFFF; }
  .sbtn[aria-pressed="true"] .l { color: #FFFFFF; }

  .submit { width: 100%; padding: 16px; border: 0; border-radius: 12px; background: var(--accent); color: #FFFFFF; font-size: 17px; font-weight: 700; cursor: pointer; margin-top: 10px; }
  .submit:disabled { opacity: .45; cursor: not-allowed; }
  .hint { text-align: center; font-size: 13.5px; color: var(--muted); margin-top: 8px; }
  .err { background: #FBEDEB; color: var(--down); border-radius: 10px; padding: 12px 14px; font-size: 14.5px; margin-top: 12px; }

  .done { text-align: center; padding: 56px 8px 24px; }
  .done img { height: 72px; width: auto; margin-bottom: 18px; }
  .done h2 { font-family: var(--f-title); font-size: 30px; color: var(--accent); margin-bottom: 8px; }
  .done p { color: var(--muted); font-size: 16px; }
  .foot { text-align: center; color: var(--muted); font-size: 12.5px; margin-top: 32px; }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { .pfill, .opt { transition: none; } }
</style>
</head>

 {"key": "C", "text": "I do something now and then", "score": 3}, {"key": "D", "text": "I have committed to one small daily habit and I track it", "score": 5}]}, {"id": "Q08", "part": 2, "type": "ladder", "pillar": "PI", "module": "1B", "label": "Self introduction", "text": "Someone new asks, “Tell me about yourself.” What do you usually say?", "options": [{"key": "A", "text": "My name and my course", "score": 1}, {"key": "B", "text": "My degree and my hometown", "score": 2}, {"key": "C", "text": "What I am interested in", "score": 3}, {"key": "D", "text": "My four part introduction: who I am, what I do, the value I bring, what I aim for", "score": 5}]}, {"id": "Q09", "part": 2, "type": "ladder", "pillar": "PI", "module": "1B", "label": "Strengths with evidence", "text": "When you talk about your strengths, what do you usually say?", "options": [{"key": "A", "text": "I am unsure what my strengths are", "score": 1}, {"key": "B", "text": "“Hardworking” and “team player”", "score": 2}, {"key": "C", "text": "I name a strength, without an example", "score": 3}, {"key": "D", "text": "I back each strength with a real moment and the result it created", "score": 5}]}, {"id": "Q10", "part": 2, "type": "ladder", "pillar": "GM", "module": "1B", "label": "Growth thinking", "text": "A thought like “I am not good at numbers” comes up. What do you usually do?", "options": [{"key": "A", "text": "I believe it", "score": 1}, {"key": "B", "text": "I avoid that subject", "score": 2}, {"key": "C", "text": "I try anyway", "score": 3}, {"key": "D", "text": "I catch the fixed thought and rewrite it as a growth thought", "score": 5}]}, {"id": "Q11", "part": 2, "type": "ladder", "pillar": "GM", "module": "1B", "label": "Learning agility", "text": "A new tool or skill is needed for your work. What do you usually do?", "options": [{"key": "A", "text": "I avoid it", "score": 1}, {"key": "B", "text": "I wait for someone to teach me", "score": 2}, {"key": "C", "text": "I learn it when it is required", "score": 3}, {"key": "D", "text": "I have picked one skill to learn fast this semester and I have started", "score": 5}]}, {"id": "Q12", "part": 2, "type": "ladder", "pillar": "FS", "module": "2A", "label": "Energy timing", "text": "When do you do your most important study?", "options": [{"key": "A", "text": "Whenever I find time", "score": 1}, {"key": "B", "text": "Late at night, when I am tired", "score": 2}, {"key": "C", "text": "Sometimes in my best hours", "score": 3}, {"key": "D", "text": "I have mapped my peak energy hours and placed my focus blocks there", "score": 5}]}, {"id": "Q13", "part": 2, "type": "ladder", "pillar": "FS", "module": "2A", "label": "Habit system", "text": "You want to build a good habit. How do you go about it?", "options": [{"key": "A", "text": "I wait to feel motivated", "score": 1}, {"key": "B", "text": "I start, then stop after a few days", "score": 2}, {"key": "C", "text": "I set reminders", "score": 3}, {"key": "D", "text": "I write an if then plan, remove blockers and track it day by day", "score": 5}]}, {"id": "Q14", "part": 2, "type": "ladder", "pillar": "CD", "module": "2B", "label": "Reading job descriptions", "text": "You see a job description online. What do you do with it?", "options": [{"key": "A", "text": "I rarely read them", "score": 1}, {"key": "B", "text": "I look at the salary and location", "score": 2}, {"key": "C", "text": "I read it once, quickly", "score": 3}, {"key": "D", "text": "I read it closely and list the skills I have and the skills I need", "score": 5}]}, {"id": "Q15", "part": 2, "type": "ladder", "pillar": "CD", "module": "2B", "label": "Industry research", "text": "How much do you know about the industry you may work in?", "options": [{"key": "A", "text": "I haven’t looked yet", "score": 1}, {"key": "B", "text": "I see news about it sometimes", "score": 2}, {"key": "C", "text": "I follow a few companies", "score": 3}, {"key": "D", "text": "I have researched its trends, key companies and roles from reliable sources", "score": 5}]}, {"id": "Q16", "part": 3, "type": "rating", "pillar": "RO", "module": null, "label": "Self check: planning", "text": "I prepare for my career every single day with a clear plan and leave nothing to chance.", "options": [{"key": "1", "text": "Not at all", "score": 1}, {"key": "2", "text": "Slightly", "score": 2}, {"key": "3", "text": "Somewhat", "score": 3}, {"key": "4", "text": "Mostly", "score": 4}, {"key": "5", "text": "Completely", "score": 5}]}, {"id": "Q17", "part": 3, "type": "rating", "pillar": "PI", "module": null, "label": "Self check: introducing myself", "text": "I can introduce myself perfectly to anyone, anywhere, every time.", "options": [{"key": "1", "text": "Not at all", "score": 1}, {"key": "2", "text": "Slightly", "score": 2}, {"key": "3", "text": "Somewhat", "score": 3}, {"key": "4", "text": "Mostly", "score": 4}, {"key": "5", "text": "Completely", "score": 5}]}, {"id": "Q18", "part": 3, "type": "rating", "pillar": "GM", "module": null, "label": "Self check: pressure and feedback", "text": "I stay perfectly calm under any pressure and welcome every piece of criticism.", "options": [{"key": "1", "text": "Not at all", "score": 1}, {"key": "2", "text": "Slightly", "score": 2}, {"key": "3", "text": "Somewhat", "score": 3}, {"key": "4", "text": "Mostly", "score": 4}, {"key": "5", "text": "Completely", "score": 5}]}, {"id": "Q19", "part": 3, "type": "rating", "pillar": "FS", "module": null, "label": "Self check: phone and focus", "text": "I have complete control over my phone and never lose focus.", "options": [{"key": "1", "text": "Not at all", "score": 1}, {"key": "2", "text": "Slightly", "score": 2}, {"key": "3", "text": "Somewhat", "score": 3}, {"key": "4", "text": "Mostly", "score": 4}, {"key": "5", "text": "Completely", "score": 5}]}, {"id": "Q20", "part": 3, "type": "rating", "pillar": "CD", "module": null, "label": "Self check: career direction", "text": "I am completely certain about my specialisation, my role and my career path.", "options": [{"key": "1", "text": "Not at all", "score": 1}, {"key": "2", "text": "Slightly", "score": 2}, {"key": "3", "text": "Somewhat", "score": 3}, {"key": "4", "text": "Mostly", "score": 4}, {"key": "5", "text": "Completely", "score": 5}]}]};

const PAGE = {
  Pre: { eyebrow: "Pre Assessment", title: "Before we begin", sub: "Before Day 1 · 2 Nov 2026 · 20 questions · about 10 minutes",
    instr: "There are no right or wrong answers. Choose what is true for you today. Low answers are expected at the start." },
  Post: { eyebrow: "Post Assessment", title: "Where you are now", sub: "After Day 2 · 3 Nov 2026 · 20 questions · about 10 minutes",
    instr: "Choose what is true for you now, after the two days. Be honest." }
}[PHASE];
const STORE = "cirp_v3_" + PHASE.toLowerCase();

/* ---------- Details fields ---------- */
const FIELDS = [
  { id: "studentName", label: "Student Name", type: "text", ph: "Enter your full name", ac: "name",
    check: v => v.trim().length >= 2 && v.trim().length <= 120 || "Enter your full name." },
  { id: "college", label: "College / Institution Name", type: "select", opts: INSTITUTIONS, def: INSTITUTIONS[0] },
  { id: "courseDept", label: "Course / Department", type: "select", opts: COURSES, def: COURSES[0] },
  { id: "yearOfStudy", label: "Year of Study", type: "select", opts: YEARS, def: "I" },
  { id: "semester", label: "Semester", type: "select", opts: SEMESTERS, def: "1" },
  { id: "registerNo", label: "Register Number", type: "text", ph: "e.g. 2503 1001", ac: "off",
    check: v => v.trim().length >= 3 && v.trim().length <= 40 || "Enter your register number." },
  { id: "mobile", label: "Mobile Number", type: "tel", ph: "10 digit mobile number", ac: "tel", im: "numeric",
    check: v => /^[6-9]\d{9}$/.test(cleanMobile(v)) || "Enter a 10 digit mobile number starting with 6, 7, 8 or 9." },
  { id: "email", label: "Email ID", type: "email", ph: "name@example.com", ac: "email",
    check: v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.trim()) || "Enter a valid email address." },
  { id: "programme", label: "Programme Name", type: "select", opts: PROGRAMMES, def: PROGRAMMES[0] },
  { id: "batchSection", label: "Batch / Section", type: "select", opts: SECTIONS, ph: "Select your batch" }
];
function cleanMobile(v) { const d = String(v).replace(/\D/g, ""); return d.length > 10 ? d.slice(-10) : d; }
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }

const fieldsEl = document.getElementById("fields");
fieldsEl.innerHTML = FIELDS.map(f => {
  const input = f.type === "select"
    ? "<select id='" + f.id + "'>" + (f.ph ? "<option value='' disabled selected>" + esc(f.ph) + "</option>" : "") + f.opts.map(o => "<option" + (o === f.def ? " selected" : "") + ">" + esc(o) + "</option>").join("") + "</select>"
    : "<input id='" + f.id + "' type='" + f.type + "' placeholder='" + esc(f.ph) + "' autocomplete='" + f.ac + "'" + (f.im ? " inputmode='" + f.im + "'" : "") + ">";
  return "<div class='field' id='f_" + f.id + "'><label for='" + f.id + "'>" + esc(f.label) + " <span class='req'>*</span></label>" + input + "<div class='ferr' id='e_" + f.id + "'></div></div>";
}).join("");

function fieldOk(f, show) {
  const el = document.getElementById(f.id), v = el.value || "";
  let ok = v.trim().length > 0, msg = "This field is required.";
  if (ok && f.check) { const r = f.check(v); if (r !== true) { ok = false; msg = r; } }
  const box = document.getElementById("f_" + f.id);
  if (show) { box.classList.toggle("bad", !ok); document.getElementById("e_" + f.id).textContent = ok ? "" : msg; }
  return ok;
}

/* ---------- Questions ---------- */
document.getElementById("eyebrow").textContent = PAGE.eyebrow;
document.getElementById("title").textContent = PAGE.title;
document.getElementById("subline").textContent = PAGE.sub;
document.getElementById("instr").textContent = PAGE.instr;
document.documentElement.lang = "en";

const answers = {};
const partNames = { 1: "Part 1 · Story", 2: "Part 2 · Situations", 3: "Part 3 · Self Check" };
let html = "";
[1, 2, 3].forEach(part => {
  html += "<section class='part'><h2>" + partNames[part] + "</h2><p class='intro'>" + esc(FORM.partIntro[part]) + "</p>";
  if (part === 1) html += "<div class='story'><h3>" + esc(FORM.story.title) + "</h3>" + FORM.story.paragraphs.map(p => "<p>" + esc(p) + "</p>").join("") + "</div>";
  FORM.items.filter(it => it.part === part).forEach(it => {
    const n = parseInt(it.id.slice(1), 10);
    html += "<div class='q' id='q_" + it.id + "'><div class='qn'>Question " + n + " of 20</div><div class='qt' id='t_" + it.id + "'>" + esc(it.text) + "</div>";
    if (it.type === "ladder") {
      html += "<div class='opts' role='group' aria-labelledby='t_" + it.id + "'>" + it.options.map(o =>
        "<button type='button' class='opt' data-q='" + it.id + "' data-v='" + o.score + "' aria-pressed='false'><span class='k'>" + o.key + "</span><span>" + esc(o.text) + "</span></button>").join("") + "</div>";
    } else {
      html += "<div class='scale' role='group' aria-labelledby='t_" + it.id + "'>" + it.options.map(o =>
        "<button type='button' class='sbtn' data-q='" + it.id + "' data-v='" + o.score + "' aria-pressed='false'><span class='n'>" + o.score + "</span><span class='l'>" + esc(o.text) + "</span></button>").join("") + "</div>";
    }
    html += "</div>";
  });
  html += "</section>";
});
document.getElementById("parts").innerHTML = html;

/* ---------- State, autosave, timing ---------- */
let startedAt = null;
function touch() { if (!startedAt) startedAt = Date.now(); }
function save() {
  try { const d = {}; FIELDS.forEach(f => d[f.id] = document.getElementById(f.id).value); localStorage.setItem(STORE, JSON.stringify({ d: d, a: answers, s: startedAt })); } catch (e) {}
}
function restore() {
  try {
    const raw = localStorage.getItem(STORE); if (!raw) return;
    const o = JSON.parse(raw);
    if (o.d) FIELDS.forEach(f => { if (o.d[f.id] != null && o.d[f.id] !== "") document.getElementById(f.id).value = o.d[f.id]; });
    if (o.a) Object.keys(o.a).forEach(q => select(q, o.a[q], true));
    if (o.s) startedAt = o.s;
  } catch (e) {}
}
function select(q, v, quiet) {
  answers[q] = Number(v);
  document.querySelectorAll("[data-q='" + q + "']").forEach(b => b.setAttribute("aria-pressed", String(Number(b.dataset.v) === Number(v))));
  document.getElementById("q_" + q).classList.remove("missing");
  if (!quiet) { touch(); save(); }
  update();
}
document.getElementById("parts").addEventListener("click", e => {
  const b = e.target.closest("[data-q]"); if (b) select(b.dataset.q, b.dataset.v);
});
FIELDS.forEach(f => {
  const el = document.getElementById(f.id);
  el.addEventListener("input", () => { touch(); save(); if (document.getElementById("f_" + f.id).classList.contains("bad")) fieldOk(f, true); update(); });
  el.addEventListener("change", () => { touch(); save(); update(); });
  el.addEventListener("blur", () => { if (el.value) fieldOk(f, true); });
});

const submitBtn = document.getElementById("submitBtn"), hint = document.getElementById("hint"), errEl = document.getElementById("err");
function update() {
  const n = Object.keys(answers).length, pct = Math.round(n / 20 * 100);
  document.getElementById("ptext").textContent = n + " of 20 answered";
  document.getElementById("ppct").textContent = pct + "%";
  document.getElementById("pfill").style.width = pct + "%";
  const detailsOk = FIELDS.every(f => fieldOk(f, false));
  submitBtn.disabled = !(detailsOk && n === 20);
  hint.textContent = submitBtn.disabled
    ? (!detailsOk ? "Complete all your details above. " : "") + (n < 20 ? (20 - n) + " question" + (20 - n === 1 ? "" : "s") + " left to answer." : "")
    : "All set. Tap Submit.";
}

/* ---------- Submit ---------- */
submitBtn.addEventListener("click", () => {
  errEl.hidden = true;
  const bad = FIELDS.filter(f => !fieldOk(f, true));
  const missing = FORM.items.filter(it => answers[it.id] == null);
  missing.forEach(it => document.getElementById("q_" + it.id).classList.add("missing"));
  if (bad.length) { document.getElementById(bad[0].id).focus(); return; }
  if (missing.length) { document.getElementById("q_" + missing[0].id).scrollIntoView({ behavior: "smooth", block: "center" }); return; }
  if (SCRIPT_URL === "YOUR_APPS_SCRIPT_URL_HERE") {
    errEl.textContent = "This page is not connected to the Google Sheet yet. Paste the Web app URL into SCRIPT_URL.";
    errEl.hidden = false; return;
  }
  const payload = { phase: PHASE, formVersion: FORM_VERSION, answers: {}, durationSec: startedAt ? Math.round((Date.now() - startedAt) / 1000) : null, userAgent: navigator.userAgent };
  FIELDS.forEach(f => payload[f.id] = document.getElementById(f.id).value.trim());
  payload.mobile = cleanMobile(payload.mobile);
  payload.email = payload.email.toLowerCase();
  FORM.items.forEach(it => payload.answers[it.id] = answers[it.id]);

  submitBtn.disabled = true; submitBtn.textContent = "Submitting…";
  fetch(SCRIPT_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) })
    .then(r => r.json())
    .then(res => {
      if (!res || !res.ok) throw new Error(res && res.error ? res.error : "not saved");
      try { localStorage.removeItem(STORE); } catch (e) {}
      const first = payload.studentName.split(/\s+/)[0];
      document.getElementById("doneMsg").textContent = "Thank you, " + first + ". Your " + PHASE + " responses are saved.";
      document.getElementById("doneTime").textContent = "Submitted at " + new Date().toLocaleString("en-IN", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
      document.getElementById("formView").hidden = true;
      document.getElementById("doneView").hidden = false;
      window.scrollTo(0, 0);
    })
    .catch(err => {
      errEl.textContent = "Your responses were not saved (" + err.message + "). Check your connection and tap Submit again.";
      errEl.hidden = false;
      submitBtn.textContent = "Submit my responses";
      update();
    });
});

restore();
update();
</script>
</body>
</html>
